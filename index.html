<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>VAULT — Personal Operating System</title>
<meta name="description" content="VAULT — личная операционная система: деньги, задачи, цели, игры и покупки в одном приложении." />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="VAULT" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="favicon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #000; overscroll-behavior-y: none; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  @keyframes slideUp { from { transform: translateY(24px); opacity:0 } to { transform: translateY(0); opacity:1 } }
  @keyframes fadeIn { from { opacity:0; transform: translate(-50%,6px) } to { opacity:1; transform: translate(-50%,0) } }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0; }
  input[type=date] { color-scheme: dark; }
</style>
</head>
<body class="bg-black">
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && !root.hasChildNodes()) {
      root.innerHTML =
        '<div style="color:#fff;background:#111;padding:24px;font-family:monospace;font-size:13px;white-space:pre-wrap;min-height:100vh;">' +
        "Ошибка загрузки приложения:\n\n" + (e.message || e) +
        (e.filename ? "\n\n" + e.filename + ":" + e.lineno : "") +
        "</div>";
    }
  });
</script>
